# Documentation site for mlp. Build with `hugo` from this directory (needs
# Go for the theme module); `hugo server` for a live preview.

baseURL: https://eldinbegano.github.io/mask-decryption/
locale: en-US
title: mlp
enableGitInfo: true
disableKinds: [taxonomy, term]

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Commands
      pageRef: /commands
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: https://github.com/EldinBegano/mask-decryption
      params:
        icon: github

params:
  description: Encrypt and decrypt files with AES-256-GCM, using a single auto-managed keyfile.
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.png
      width: 24
      height: 24
  footer:
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/EldinBegano/mask-decryption/edit/main/docs/content
  displayUpdatedDate: true
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
  highlight:
    copy:
      enable: true
      display: hover
